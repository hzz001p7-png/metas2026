<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Metas 2026</title>

<style>
body{
  font-family: Arial;
  background:#f4f4f4;
  margin:0;
}

h1{
  text-align:center;
  margin-top:20px;
}

.container{
  display:flex;
  justify-content:center;
  gap:40px;
  margin-top:40px;
}

.left{
  background:white;
  padding:20px;
  width:300px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.right{
  width:400px;
}

input, select{
  width:100%;
  padding:8px;
  margin-bottom:10px;
}

button{
  padding:6px 10px;
  border:none;
  cursor:pointer;
  border-radius:5px;
  margin-top:5px;
}

.addBtn{
  background:#333;
  color:white;
  width:100%;
}

.meta{
  background:white;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
  box-shadow:0 0 5px rgba(0,0,0,0.1);
}

.concluida{
  background:#d4edda;
  text-decoration:line-through;
}

.section-title{
  margin-top:20px;
  font-weight:bold;
}

.progress-bar{
  background:#ddd;
  height:20px;
  border-radius:10px;
  overflow:hidden;
  margin-top:10px;
}

.progress{
  background:#333;
  height:100%;
  width:0%;
  color:white;
  text-align:center;
}
</style>
</head>
<body>

<h1>Metas 2026</h1>

<div class="container">

<div class="left">
<h3>Adicionar Meta</h3>

<input id="metaInput" placeholder="Digite uma meta">

<select id="mes">
<option>Decorrer do ano</option>
<option>Janeiro</option>
<option>Fevereiro</option>
<option>Março</option>
<option>Abril</option>
<option>Maio</option>
<option>Junho</option>
<option>Julho</option>
<option>Agosto</option>
<option>Setembro</option>
<option>Outubro</option>
<option>Novembro</option>
<option>Dezembro</option>
</select>

<button class="addBtn" onclick="addMeta()">Adicionar</button>

<div class="progress-bar">
<div id="progress" class="progress">0%</div>
</div>

</div>

<div class="right">

<div class="section-title">Metas Pendentes</div>
<div id="pendentes"></div>

<div class="section-title">Metas Concluídas</div>
<div id="concluidas"></div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCaHZ7sm6-sPp4zpnpOB8dwzDwbunsExC8",
  authDomain: "metas-ana-e-th.firebaseapp.com",
  projectId: "metas-ana-e-th",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const pendentesDiv = document.getElementById("pendentes");
const concluidasDiv = document.getElementById("concluidas");
const progressBar = document.getElementById("progress");

function addMeta(){
  const texto = document.getElementById("metaInput").value;
  const mes = document.getElementById("mes").value;

  if(texto !== ""){
    addDoc(collection(db,"metas"),{
      texto:texto,
      mes:mes,
      concluida:false
    });
    document.getElementById("metaInput").value="";
  }
}

window.addMeta = addMeta;

function atualizarProgresso(docs){
  let total = docs.length;
  let concluidas = docs.filter(d=>d.data().concluida).length;
  let porcentagem = total === 0 ? 0 : Math.round((concluidas/total)*100);
  progressBar.style.width = porcentagem+"%";
  progressBar.innerHTML = porcentagem+"%";
}

onSnapshot(collection(db,"metas"),(snapshot)=>{
  pendentesDiv.innerHTML="";
  concluidasDiv.innerHTML="";
  let docs = [];

  snapshot.forEach((docItem)=>{
    docs.push(docItem);
    let data = docItem.data();

    let metaHTML = `
    <div class="meta ${data.concluida ? "concluida" : ""}">
      <strong>${data.texto}</strong><br>
      <small>${data.mes}</small><br>
      <button onclick="toggle('${docItem.id}',${data.concluida})">
        ${data.concluida ? "Desfazer" : "Concluir"}
      </button>
      <button onclick="excluir('${docItem.id}')">Excluir</button>
    </div>
    `;

    if(data.concluida){
      concluidasDiv.innerHTML += metaHTML;
    } else {
      pendentesDiv.innerHTML += metaHTML;
    }
  });

  atualizarProgresso(docs);
});

window.toggle = async (id, status)=>{
  const ref = doc(db,"metas",id);
  await updateDoc(ref,{concluida:!status});
}

window.excluir = async (id)=>{
  const ref = doc(db,"metas",id);
  await deleteDoc(ref);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Metas 2026 💕</title>
<style>
body{
  font-family: Arial;
  background:#fce4ec;
  text-align:center;
}
.container{
  background:white;
  padding:20px;
  width:350px;
  margin:auto;
  margin-top:40px;
  border-radius:10px;
}
button{
  background:#e91e63;
  color:white;
  border:none;
  padding:8px;
  cursor:pointer;
}
input{
  padding:5px;
}
.meta{
  background:#f8bbd0;
  margin:5px;
  padding:5px;
  border-radius:5px;
}
</style>
</head>
<body>

<div class="container">
<h2>Metas 2026 💖</h2>

<input id="metaInput" placeholder="Digite uma meta">
<button onclick="addMeta()">Adicionar</button>

<div id="metas"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCaHZ7sm6-sPp4zpnpOB8dwzDwbunsExC8",
  authDomain: "metas-ana-e-th.firebaseapp.com",
  projectId: "metas-ana-e-th",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const metasDiv = document.getElementById("metas");

function addMeta(){
  const valor = document.getElementById("metaInput").value;
  if(valor != ""){
    addDoc(collection(db,"metas"),{texto:valor});
    document.getElementById("metaInput").value="";
  }
}

window.addMeta = addMeta;

onSnapshot(collection(db,"metas"),(snapshot)=>{
  metasDiv.innerHTML="";
  snapshot.forEach((doc)=>{
    metasDiv.innerHTML += `<div class="meta">${doc.data().texto}</div>`;
  });
});
</script>

</body>
</html>
